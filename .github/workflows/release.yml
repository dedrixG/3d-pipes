name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libglib2.0-0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libfontconfig1

      - name: Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt "pyinstaller>=6"

      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -v

      - name: AppImage
        run: |
          chmod +x scripts/build-appimage.sh
          ./scripts/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/3D_Pipes-x86_64.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python deps
        run: python -m pip install -r requirements.txt "pyinstaller>=6"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Windows exe / scr
        run: scripts\build-windows.bat

      - name: Zip
        run: Compress-Archive -Force -Path dist\3DPipes.exe,dist\3DPipes.scr -DestinationPath dist\3DPipes-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/3DPipes.exe
            dist/3DPipes.scr
            dist/3DPipes-windows.zip
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Release notes from CHANGELOG
        run: python3 scripts/changelog-excerpt.py > artifacts/release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/3D_Pipes-x86_64.AppImage
            artifacts/3DPipes.exe
            artifacts/3DPipes.scr
            artifacts/3DPipes-windows.zip
          body_path: artifacts/release-notes.md
          fail_on_unmatched_files: true
          make_latest: true
